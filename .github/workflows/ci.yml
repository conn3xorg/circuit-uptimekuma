name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      # The release before the default, so the upgrade below has data to carry.
      - name: Apply the previous release, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_uptimekuma_version: "2.5.8"
          TF_VAR_image_digest: sha256:20abea8c48a163cf0a7a5d5936ab418e4b742d908704e1f58f6c06e56a9c6b67
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Creates the admin over Uptime Kuma's socket.io API, the way the setup
      # page does, adds a monitor for Uptime Kuma itself and one for a closed
      # port, and waits for the first to report up and the second down.
      - name: Create the admin and two monitors
        working-directory: examples/local
        run: sudo podman exec -i circuit-uptimekuma podman exec -i uptime-kuma node - setup < check.js
      - name: Upgrade to the default release, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-uptimekuma podman inspect uptime-kuma --format '{{.ImageName}}' | grep -q '@sha256:e88415a90dd2'
      - name: Log in and see the monitors report after the upgrade
        working-directory: examples/local
        run: &verify sudo podman exec -i circuit-uptimekuma podman exec -i uptime-kuma node - verify < check.js
      # Restarting the container boots systemd again, so this checks Uptime
      # Kuma is enabled and comes back with its database.
      - name: Restart the host, then wait for Uptime Kuma
        run: |
          sudo podman restart circuit-uptimekuma
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-uptimekuma systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          for _ in $(seq 120); do
            sudo podman exec circuit-uptimekuma podman exec uptime-kuma node -e 'fetch("http://127.0.0.1:3001/api/entry-page").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))' 2>/dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Log in and see the monitors report after the restart
        working-directory: examples/local
        run: *verify
      - name: Plan again after the restart, with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: Check only root can enter the data directory
        run: '[ "$(sudo podman exec circuit-uptimekuma stat -c "%u %a" /var/lib/uptime-kuma)" = "0 700" ]'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
